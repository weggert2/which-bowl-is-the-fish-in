[package]
name = "which-bowl"
version = "0.1.0"
edition = "2021"
authors = ["Bill"]
description = "Which Bowl is the Fish In - A shell game with fish"
license = "MIT"

[dependencies]
eframe = "0.29"
egui = "0.29"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
toml = "0.8"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
image = "0.25"

[features]
embedded-assets = []

[profile.release]
opt-level = 2
lto = false
