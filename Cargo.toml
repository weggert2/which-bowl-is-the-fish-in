[package]
name = "which-bowl"
version = "1.0.0"
edition = "2021"
authors = ["Bill"]
description = "Which Bowl is the Fish In - A shell game with fish"
license = "MIT"

[dependencies]
macroquad = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
toml = "0.8"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
ico = "0.4"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
embedded-assets = []

[profile.release]
opt-level = 2
lto = false
